# Piccolo Configuration
# This file centralizes all runtime configuration.
# Values here replace hardcoded constants scattered across the codebase.

# Mode
simulate: true          # true = use HardwareSimulator, false = connect to real hardware
launch_rp: true         # true = deploy code and load bitstream on startup (ignored in sim mode)
camera_enabled: true    # true = start camera thread (requires pypylon + OpenCV)

# Red Pitaya connection
# Credentials are loaded via --rp-login (not stored here for security).
rp_dir: "piccolo_testing"
rp_script: "piccolo_api.py"    # FastAPI server entry on the Red Pitaya
api_port: 8000                 # Red Pitaya FastAPI server port

# Laser
laser_config_path: "../config/laser_config.json"

# Cetoni syringe pumps
# SAFETY: pumps default to SIMULATED and disabled. Connecting to real pumps requires
# BOTH pumps_enabled: true AND pumps_simulate: false — do NOT enable with glass
# syringes loaded. cetoni_deviceconfig must point at the Cetoni Elements config folder.
pumps_enabled: false
pumps_simulate: true
cetoni_deviceconfig: null
routines_path: "../config/pump_routines.json"
pumps:
  - {name: pump0, inner_diameter_mm: 7.28, max_piston_stroke_mm: 60.0, max_volume_ul: 1000.0, max_flow_ul_min: 6000.0, initial_fill_ul: 500.0}
  - {name: pump1, inner_diameter_mm: 7.28, max_piston_stroke_mm: 60.0, max_volume_ul: 1000.0, max_flow_ul_min: 6000.0, initial_fill_ul: 500.0}
  - {name: pump2, inner_diameter_mm: 7.28, max_piston_stroke_mm: 60.0, max_volume_ul: 1000.0, max_flow_ul_min: 6000.0, initial_fill_ul: 500.0}
  - {name: pump3, inner_diameter_mm: 7.28, max_piston_stroke_mm: 60.0, max_volume_ul: 1000.0, max_flow_ul_min: 6000.0, initial_fill_ul: 500.0}

# Data
buffer_size: 1000       # Max droplet data rows kept in memory
adc_samples: 4096       # ADC samples per channel per acquisition

# ADC calibration per channel: [offset, gain]
calibration:
  CH1: [-10, 1.0]
  CH2: [-10, 1.0]
  CH3: [-10, 1.0]       # Placeholder, adjust as needed
  CH4: [-10, 1.0]       # Placeholder, adjust as needed

# UI
server_url: "http://127.0.0.1:8050/"
server_port: 8050
update_interval_ms: 250   # Dash graph update interval
counter_interval_ms: 1000 # Droplet counter update interval
